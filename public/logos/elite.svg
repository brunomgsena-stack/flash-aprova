<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1e40af" opacity="0.1" stroke="#1e40af" stroke-width="2"/>

  <!-- Graduation cap -->
  <g transform="translate(100, 60)">
    <!-- Cap top -->
    <polygon points="0,-35 -40,-15 40,-15" fill="#1e40af"/>
    <!-- Cap band -->
    <rect x="-42" y="-15" width="84" height="8" fill="#1e40af"/>
    <!-- Tassel -->
    <line x1="0" y1="-7" x2="0" y2="20" stroke="#1e40af" stroke-width="2"/>
    <circle cx="0" cy="22" r="3" fill="#1e40af"/>
  </g>

  <!-- Open book -->
  <g transform="translate(100, 110)">
    <!-- Left page -->
    <path d="M -30 -15 L -10 -15 L -8 20 L -28 20 Z" fill="#1e40af" opacity="0.8"/>
    <!-- Right page -->
    <path d="M 10 -15 L 30 -15 L 28 20 L 8 20 Z" fill="#1e40af" opacity="0.6"/>
    <!-- Book spine -->
    <line x1="-8" y1="-15" x2="8" y2="-15" stroke="#1e40af" stroke-width="2"/>
    <line x1="-8" y1="20" x2="8" y2="20" stroke="#1e40af" stroke-width="2"/>
    <!-- Lines on pages -->
    <line x1="-25" y1="0" x2="-15" y2="0" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
    <line x1="-25" y1="8" x2="-15" y2="8" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
    <line x1="15" y1="0" x2="25" y2="0" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
    <line x1="15" y1="8" x2="25" y2="8" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
  </g>
</svg>
